<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Columbia River Gorge Fire Risk Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        .legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            z-index: 1000;
            background: white;
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            font-size: 12px;
            max-width: 240px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .legend h4 { margin-bottom: 8px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-color { width: 16px; height: 16px; border-radius: 3px; margin-right: 8px; flex-shrink: 0; }
        .legend-line { width: 16px; height: 3px; margin-right: 8px; flex-shrink: 0; }
        
        .layer-control {
            position: absolute;
            top: 10px;
            left: 55px;
            z-index: 1000;
            background: white;
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            font-size: 13px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .layer-control h4 { margin-bottom: 8px; }
        .layer-control label { display: block; margin-bottom: 4px; cursor: pointer; }
        .layer-control input { margin-right: 6px; }
        .layer-section { margin-top: 6px; padding-top: 6px; border-top: 1px solid #eee; }
        .layer-section-title { font-weight: 600; font-size: 11px; text-transform: uppercase; color: #666; margin-bottom: 4px; }
        
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-direction: column;
            gap: 12px;
        }
        .loading-overlay.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #eee;
            border-top-color: #e74c3c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .color-by-select {
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 12px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div>Loading 19,734 parcels...</div>
    </div>
    
    <div class="layer-control" id="layers">
        <h4>Layers</h4>
        <label><input type="checkbox" id="toggle-parcels" checked> Parcels (19,734)</label>
        <label><input type="checkbox" id="toggle-firewise" checked> Firewise USA® Sites (34)</label>
        
        <div class="layer-section">
            <div class="layer-section-title">Fire Perimeters (2020–2025)</div>
            <label><input type="checkbox" id="toggle-rowena" checked> Rowena 2025 (3,700 ac)</label>
            <label><input type="checkbox" id="toggle-burdoin" checked> Burdoin 2025 (10,675 ac)</label>
            <label><input type="checkbox" id="toggle-tunnel5" checked> Tunnel Five 2023 (529 ac)</label>
            <label><input type="checkbox" id="toggle-mosier" checked> Mosier Creek 2020 (985 ac)</label>
            <label><input type="checkbox" id="toggle-whisky" checked> Whisky Creek 2024 (3,240 ac)</label>
            <label><input type="checkbox" id="toggle-microwave" checked> Microwave Tower 2024 (1,314 ac)</label>
            <label><input type="checkbox" id="toggle-bighollow"> Big Hollow 2020 (24,995 ac)</label>
            <label><input type="checkbox" id="toggle-wrentham"> Wrentham Market 2021 (5,798 ac)</label>
        </div>
        
        <hr style="margin: 8px 0;">
        <label style="font-weight: 500;">Color parcels by:</label>
        <select class="color-by-select" id="color-by">
            <option value="whp">USFS Wildfire Hazard Potential</option>
            <option value="evac_burdoin">Burdoin Proximity Zone (WA only)</option>
            <option value="evac_rowena">Rowena Proximity Zone (OR only)</option>
            <option value="in_burn">In Burn Area (any fire)</option>
            <option value="county">County</option>
        </select>
    </div>
    
    <div class="legend" id="legend">
        <h4>Wildfire Hazard Potential</h4>
        <div id="legend-items"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            center: [45.68, -121.30],
            zoom: 11,
            preferCanvas: true
        });

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 19
        });
        const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxZoom: 17
        });
        osm.addTo(map);
        L.control.layers({'Street': osm, 'Satellite': satellite, 'Topographic': topo}).addTo(map);

        // Color schemes
        const whpColors = {
            'Non-burnable': '#2ecc40',
            'Very Low': '#a8e6cf',
            'Low': '#ffd93d',
            'Moderate': '#ff9f43',
            'High': '#ee5a24',
            'Very High': '#b71540'
        };
        const evacColors = {
            'Level 1: BE READY': '#ffd93d',
            'Level 2: BE SET': '#ff9f43',
            'Level 3: GO NOW': '#ee5a24',
            '': '#999'
        };
        const countyColors = {
            'Hood River': '#3498db',
            'Wasco': '#e74c3c',
            'Klickitat': '#2ecc71',
            'Skamania': '#9b59b6',
            'Sherman': '#f39c12',
            'Multnomah': '#1abc9c'
        };
        // Fire perimeter colors
        const fireColors = {
            rowena: '#e74c3c',
            burdoin: '#8e44ad',
            tunnel5: '#e67e22',
            mosier: '#2980b9',
            whisky: '#c0392b',
            microwave: '#d35400',
            bighollow: '#7f8c8d',
            wrentham: '#16a085'
        };

        let currentColorBy = 'whp';
        let parcelLayer = null;
        let parcelsData = null;

        function getColor(props) {
            switch(currentColorBy) {
                case 'whp': return whpColors[props.whp] || '#999';
                case 'evac_burdoin': return evacColors[props.evac_burdoin] || '#ccc';
                case 'evac_rowena': return evacColors[props.evac_rowena] || '#ccc';
                case 'in_burn':
                    if (props.in_burn_rowena === 'Yes' || props.in_burn_burdoin === 'Yes') return '#e74c3c';
                    return '#2ecc40';
                case 'county': return countyColors[props.county] || '#999';
                default: return '#3498db';
            }
        }

        function formatPopup(props) {
            let html = '<div style="font-size:12px; max-width:280px;">';
            html += `<strong>${props.addr || 'Unknown Address'}</strong><br>`;
            html += `${props.city || ''}, ${props.state || ''}<br>`;
            html += `<hr style="margin:4px 0;">`;
            html += `<b>Parcel:</b> ${props.id || 'N/A'}<br>`;
            html += `<b>County:</b> ${props.county || 'N/A'}<br>`;
            if (props.class) html += `<b>Class:</b> ${props.class}<br>`;
            if (props.value) html += `<b>Assessed Value:</b> $${Number(props.value).toLocaleString()}<br>`;
            html += `<hr style="margin:4px 0;">`;
            html += `<b>USFS Fire Risk:</b> ${props.whp || 'N/A'}<br>`;
            if (props.fire) html += `<b>Fire History:</b> ${props.fire}<br>`;
            if (props.evac_rowena) html += `<b>Rowena Proximity Zone:</b> ${props.evac_rowena}<br>`;
            if (props.evac_burdoin) html += `<b>Burdoin Proximity Zone:</b> ${props.evac_burdoin}<br>`;
            if (props.in_burn_rowena === 'Yes') html += `<b>In Rowena Burn:</b> Yes<br>`;
            if (props.in_burn_burdoin === 'Yes') html += `<b>In Burdoin Burn:</b> Yes<br>`;
            if (props.dist_rowena) html += `<b>Dist to Rowena:</b> ${props.dist_rowena} mi<br>`;
            if (props.dist_burdoin) html += `<b>Dist to Burdoin:</b> ${props.dist_burdoin} mi<br>`;
            if (props.damage_rowena) html += `<b>Rowena Damage:</b> ${props.damage_rowena}<br>`;
            html += '</div>';
            return html;
        }

        function renderParcels(geojson) {
            if (parcelLayer) map.removeLayer(parcelLayer);
            parcelLayer = L.geoJSON(geojson, {
                pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 4,
                        fillColor: getColor(feature.properties),
                        color: '#333',
                        weight: 0.5,
                        opacity: 0.8,
                        fillOpacity: 0.7
                    });
                },
                onEachFeature: function(feature, layer) {
                    layer.bindPopup(formatPopup(feature.properties));
                }
            });
            parcelLayer.addTo(map);
        }

        function updateLegend() {
            const items = document.getElementById('legend-items');
            let html = '';
            switch(currentColorBy) {
                case 'whp':
                    document.querySelector('#legend h4').textContent = 'Wildfire Hazard Potential';
                    for (const [label, color] of Object.entries(whpColors)) {
                        html += `<div class="legend-item"><div class="legend-color" style="background:${color}"></div> ${label}</div>`;
                    }
                    break;
                case 'evac_burdoin':
                case 'evac_rowena':
                    document.querySelector('#legend h4').textContent = 'Estimated Proximity Zone';
                    html += `<div class="legend-item"><div class="legend-color" style="background:#ffd93d"></div> Level 1: BE READY (≤5mi)</div>`;
                    html += `<div class="legend-item"><div class="legend-color" style="background:#ff9f43"></div> Level 2: BE SET (≤1.5mi)</div>`;
                    html += `<div class="legend-item"><div class="legend-color" style="background:#ee5a24"></div> Level 3: GO NOW (in perimeter)</div>`;
                    html += `<div class="legend-item"><div class="legend-color" style="background:#ccc"></div> Not in zone</div>`;
                    html += `<div style="font-size:10px; color:#666; margin-top:4px;">Note: Modeled from fire perimeter distance.<br>Not official evacuation orders.</div>`;
                    break;
                case 'in_burn':
                    document.querySelector('#legend h4').textContent = 'Burn Area';
                    html += `<div class="legend-item"><div class="legend-color" style="background:#e74c3c"></div> In burn area</div>`;
                    html += `<div class="legend-item"><div class="legend-color" style="background:#2ecc40"></div> Not in burn area</div>`;
                    break;
                case 'county':
                    document.querySelector('#legend h4').textContent = 'County';
                    for (const [label, color] of Object.entries(countyColors)) {
                        html += `<div class="legend-item"><div class="legend-color" style="background:${color}"></div> ${label}</div>`;
                    }
                    break;
            }
            html += `<hr style="margin: 8px 0;">`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.rowena}"></div> Rowena 2025</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.burdoin}"></div> Burdoin 2025</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.tunnel5}"></div> Tunnel Five 2023</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.mosier}"></div> Mosier Creek 2020</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.whisky}"></div> Whisky Creek 2024</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.microwave}"></div> Microwave Tower 2024</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.bighollow}"></div> Big Hollow 2020</div>`;
            html += `<div class="legend-item"><div class="legend-line" style="background:${fireColors.wrentham}"></div> Wrentham Market 2021</div>`;
            html += `<hr style="margin: 8px 0;">`;
            html += `<div class="legend-item"><div class="legend-color" style="background:#27ae60; border-radius:50%;"></div> Firewise USA® Site</div>`;
            items.innerHTML = html;
        }
        updateLegend();

        // Fire perimeter loader helper
        function loadFirePerimeter(url, color, name, details) {
            return fetch(url)
                .then(r => r.json())
                .then(data => {
                    return L.geoJSON(data, {
                        style: {
                            color: color,
                            weight: 3,
                            fillColor: color,
                            fillOpacity: 0.08,
                            dashArray: '5,5'
                        },
                        onEachFeature: function(feature, layer) {
                            const p = feature.properties;
                            layer.bindPopup(`
                                <div style="font-size:12px;">
                                    <strong style="color:${color}">${name}</strong><br>
                                    <b>Size:</b> ${p.poly_GISAcres ? Math.round(p.poly_GISAcres).toLocaleString() : details.acres} acres<br>
                                    <b>Year:</b> ${details.year}<br>
                                    <b>Location:</b> ${details.location}<br>
                                    <b>Cause:</b> ${p.attr_FireCause || details.cause || 'Unknown'}<br>
                                    ${p.attr_EstimatedCostToDate ? '<b>Cost:</b> $' + p.attr_EstimatedCostToDate.toLocaleString() + '<br>' : ''}
                                    <b>Source:</b> NIFC WFIGS Interagency Perimeters
                                </div>
                            `);
                        }
                    });
                });
        }

        // Load all fire perimeters
        let fireLayers = {};

        loadFirePerimeter('rowena_perimeter.geojson', fireColors.rowena, 'Rowena Fire', 
            {acres: '3,700', year: '2025', location: '2 mi NW of The Dalles, OR', cause: 'Human'})
            .then(layer => { fireLayers.rowena = layer; layer.addTo(map); });

        loadFirePerimeter('burdoin_perimeter.geojson', fireColors.burdoin, 'Burdoin Fire',
            {acres: '10,675', year: '2025', location: '5 mi W of Lyle, WA', cause: 'Human'})
            .then(layer => { fireLayers.burdoin = layer; layer.addTo(map); });

        loadFirePerimeter('tunnel_5_perimeter.geojson', fireColors.tunnel5, 'Tunnel Five Fire',
            {acres: '529', year: '2023', location: 'Skamania County, WA', cause: 'Human'})
            .then(layer => { fireLayers.tunnel5 = layer; layer.addTo(map); });

        loadFirePerimeter('mosier_creek_perimeter.geojson', fireColors.mosier, 'Mosier Creek Fire',
            {acres: '985', year: '2020', location: '2 mi S of Mosier, OR', cause: 'Human'})
            .then(layer => { fireLayers.mosier = layer; layer.addTo(map); });

        loadFirePerimeter('whisky_creek_perimeter.geojson', fireColors.whisky, 'Whisky Creek Fire',
            {acres: '3,240', year: '2024', location: '6 mi SE of Cascade Locks, OR', cause: 'Human'})
            .then(layer => { fireLayers.whisky = layer; layer.addTo(map); });

        loadFirePerimeter('microwave_tower_perimeter.geojson', fireColors.microwave, 'Microwave Tower Fire',
            {acres: '1,314', year: '2024', location: '1 mi WSW of Mosier, OR', cause: 'Human'})
            .then(layer => { fireLayers.microwave = layer; layer.addTo(map); });

        loadFirePerimeter('big_hollow_perimeter.geojson', fireColors.bighollow, 'Big Hollow Fire',
            {acres: '24,995', year: '2020', location: 'Skamania County, WA', cause: 'Human'})
            .then(layer => { fireLayers.bighollow = layer; });

        loadFirePerimeter('wrentham_market_perimeter.geojson', fireColors.wrentham, 'Wrentham Market Fire',
            {acres: '5,798', year: '2021', location: '7 mi SE of The Dalles, OR', cause: 'Undetermined'})
            .then(layer => { fireLayers.wrentham = layer; });

        // Load Firewise sites
        let firewiseLayer;
        fetch('firewise_gorge.geojson')
            .then(r => r.json())
            .then(data => {
                firewiseLayer = L.geoJSON(data, {
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 10,
                            fillColor: '#27ae60',
                            color: '#1a7a42',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    },
                    onEachFeature: function(feature, layer) {
                        const p = feature.properties;
                        layer.bindPopup(`
                            <div style="font-size:12px; max-width:260px;">
                                <strong>🛡️ Firewise USA® Certified</strong><br>
                                <b>${p.Name || 'Unknown'}</b><br>
                                ${p.City || ''}, ${p.County || ''}, ${p.State || ''}<br>
                                <hr style="margin:4px 0;">
                                <b>Residents:</b> ${p.ResidentCount ? p.ResidentCount.toLocaleString() : 'N/A'}<br>
                                <b>Approved:</b> ${p.ApprovalYear || 'N/A'}<br>
                                <b>Status:</b> In Good Standing<br>
                                <b>Source:</b> NFPA Firewise USA® Sites (2024)
                            </div>
                        `);
                    }
                }).addTo(map);
            });

        // Load parcels
        fetch('parcels_web.geojson')
            .then(r => r.json())
            .then(data => {
                parcelsData = data;
                renderParcels(data);
                document.getElementById('loading').classList.add('hidden');
            });

        // Layer toggle helper
        function setupToggle(id, layerKey) {
            document.getElementById(id).addEventListener('change', function() {
                if (this.checked && fireLayers[layerKey]) fireLayers[layerKey].addTo(map);
                else if (fireLayers[layerKey]) map.removeLayer(fireLayers[layerKey]);
            });
        }

        document.getElementById('toggle-parcels').addEventListener('change', function() {
            if (this.checked) { if (parcelsData) renderParcels(parcelsData); }
            else { if (parcelLayer) map.removeLayer(parcelLayer); }
        });
        document.getElementById('toggle-firewise').addEventListener('change', function() {
            if (this.checked && firewiseLayer) firewiseLayer.addTo(map);
            else if (firewiseLayer) map.removeLayer(firewiseLayer);
        });

        setupToggle('toggle-rowena', 'rowena');
        setupToggle('toggle-burdoin', 'burdoin');
        setupToggle('toggle-tunnel5', 'tunnel5');
        setupToggle('toggle-mosier', 'mosier');
        setupToggle('toggle-whisky', 'whisky');
        setupToggle('toggle-microwave', 'microwave');
        setupToggle('toggle-bighollow', 'bighollow');
        setupToggle('toggle-wrentham', 'wrentham');

        // Color scheme change
        document.getElementById('color-by').addEventListener('change', function() {
            currentColorBy = this.value;
            if (parcelsData && document.getElementById('toggle-parcels').checked) {
                renderParcels(parcelsData);
            }
            updateLegend();
        });
    </script>
</body>
</html>
